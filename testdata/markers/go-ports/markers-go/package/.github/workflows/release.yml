# Generated by go-anything: build the port for every platform and pack it.
#
# It does not publish anything: download the artifacts from the run and release them yourself.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm: darwin-arm64
            goos: darwin
            goarch: arm64
          - npm: darwin-x64
            goos: darwin
            goarch: amd64
          - npm: linux-x64-gnu
            goos: linux
            goarch: amd64
          - npm: linux-arm64-gnu
            goos: linux
            goarch: arm64
          - npm: win32-x64-msvc
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || (matrix.goos == 'windows' && 'windows-latest' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: |
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -buildmode=c-shared -o dist/libport ./cmd/portlib
      - uses: actions/upload-artifact@v4
        with:
          name: mk-${{ matrix.npm }}
          path: dist/
